org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
\n# --- Workaround: Kotlin incremental compilation crashing (different drive roots C: vs D:) ---
# Deshabilita incremental para evitar el AssertionError de caches (se puede reactivar más tarde)
kotlin.incremental=false
kotlin.incremental.android=false
# Ejecutar el compilador en el mismo proceso (a veces más estable en Windows multi-drive)
kotlin.compiler.execution.strategy=in-process
# Puedes reactivar luego quitando estas líneas si ya no falla.
